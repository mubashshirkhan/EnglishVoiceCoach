spring.application.name=english-voice-coach

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
ollama.connect-timeout-ms=${OLLAMA_CONNECT_TIMEOUT_MS:3000}
ollama.response-timeout-ms=${OLLAMA_RESPONSE_TIMEOUT_MS:120000}

stt.base-url=${STT_BASE_URL:http://localhost:8000}
stt.connect-timeout-ms=${STT_CONNECT_TIMEOUT_MS:3000}
stt.response-timeout-ms=${STT_RESPONSE_TIMEOUT_MS:120000}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

tts.executable=${PIPER_EXECUTABLE:${user.dir}/../tts/.venv/Scripts/piper.exe}
tts.model=${PIPER_MODEL:${user.dir}/../tts/voices/en_US-lessac-medium.onnx}
tts.timeout-ms=${PIPER_TIMEOUT_MS:30000}
